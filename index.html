```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Countdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            margin: 20px;
        }

        #countdown {
            font-size: 40px;
            font-weight: bold;
            margin: 30px;
        }

        #openButton {
            display: none;
            padding: 15px 25px;
            font-size: 18px;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Document</h1>

    <p>The document will be available in:</p>

    <div id="countdown">01:00</div>

    <a id="openButton" href="document.pdf">
        Open PDF
    </a>

    <script>

        // Start the countdown when the page is opened
        const releaseTime = Date.now() + (1 * 60 * 1000);

        function updateCountdown() {

            const now = Date.now();
            const difference = releaseTime - now;

            if (difference <= 0) {

                document.getElementById("countdown").innerHTML =
                    "The document is now available!";

                document.getElementById("openButton").style.display =
                    "inline-block";

                return;
            }

            const minutes = Math.floor(
                difference / (1000 * 60)
            );

            const seconds = Math.floor(
                (difference % (1000 * 60)) / 1000
            );

            document.getElementById("countdown").innerHTML =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
```
